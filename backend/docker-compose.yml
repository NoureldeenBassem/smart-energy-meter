version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: smart_meter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_meter
      POSTGRES_USER: smart_meter_user
      POSTGRES_PASSWORD: smart_meter_pass
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart_meter_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
volumes:
  pg_data: